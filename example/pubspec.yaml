name: dz_id_reader_example
description: "Test app for the dz_id_reader package: scan a document, read its chip."
publish_to: 'none'

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dz_id_reader:
    path: ../
  camera: ^0.12.0+2
  dmrtd:
    git:
      url: https://github.com/ZeroPass/dmrtd.git
      ref: 3b6c091
  flutter_nfc_kit: 3.6.2
  google_mlkit_text_recognition: ^0.16.0
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
