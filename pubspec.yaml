name: dz_id_reader
description: "Reads Algerian ID cards, passports and driving licences over NFC, with MRZ scanning."
version: 0.0.1
publish_to: none
repository: https://github.com/aniszouagh/dz_id_reader

environment:
  sdk: ^3.10.4
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  crypto: ^3.0.6
  dmrtd:
    git:
      url: https://github.com/ZeroPass/dmrtd.git
      ref: 3b6c091
  flutter_nfc_kit: 3.6.2
  google_mlkit_text_recognition: ^0.16.0
  jpeg2000: ^0.1.4
  logging: ^1.3.0
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dzexpert.dz_id_reader
        pluginClass: DzIdReaderPlugin
